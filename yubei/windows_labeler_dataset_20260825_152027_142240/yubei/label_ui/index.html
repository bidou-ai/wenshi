<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wenshi 数据标注</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">WENSHI / YUBEI</span><h1>水稻视觉数据标注</h1><p id="capture-info">当前照片批次：普通</p></div><div id="progress">0 / 0</div></header>
  <main class="layout">
    <aside class="sidebar"><div class="toolbar"><select id="filter"><option value="all">全部图片</option><option value="flower">开花批次</option><option value="rice">水稻批次</option><option value="unlabelled">未标注</option><option value="ambiguous">存在歧义</option><option value="labelled">已标注</option></select><button id="prev">上一张</button><button id="next">下一张</button></div><div id="image-list"></div></aside>
    <section class="workspace"><div class="canvas-wrap"><canvas id="canvas"></canvas><div id="empty">请选择一张图片开始标注</div></div><div class="controls"><button id="rice" class="class active">新增 rice</button><button id="flower" class="class">新增 flower</button><select id="zoom" aria-label="图像缩放"><option value="fit">适合窗口</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select><button id="set-selected-class">把选中框改为当前类别</button><button id="undo">撤销</button><button id="redo">重做</button><button id="copy">复制上一张框</button><button id="delete">删除选中框</button><button id="skip">标记歧义</button><button id="exclude">无目标/质量差/重复图</button><button id="save" class="primary">保存</button><button id="save-next" class="primary">保存并下一张</button></div><p class="hint">拖动空白区域新建框；拖动已有框移动。开花照片请框选可见花部，整株照片框选完整植株。无法确认归属时标记歧义。</p></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
