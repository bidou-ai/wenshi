<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Wenshi 表型复核台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="product-title"><p>WENSHI PHENOTYPING</p><h1>表型复核台</h1></div>
      <div class="run-control"><label for="runSelector">表型批次</label><select id="runSelector" aria-label="选择表型批次"><option value="">正在读取表型批次</option></select><span id="selectedRun">未选择</span></div>
      <div class="connection-panel"><div id="systemStatus" class="connection-state status-neutral" role="status"><span class="status-dot" aria-hidden="true"></span><strong id="systemStatusText">正在连接</strong></div><div class="refresh-meta"><span>最后更新</span><strong id="lastRefresh">--:--:--</strong></div></div>
      <div class="header-actions"><button id="access" class="button button-quiet" type="button">访问 PIN</button><button id="exportRun" class="button button-primary" type="button" hidden>导出 CSV</button><button id="refresh" class="button button-quiet" type="button" title="刷新数据">刷新</button></div>
    </header>
    <div id="errorBanner" class="error-banner" role="alert" hidden></div>
    <section class="overview-strip" aria-label="表型批次概览"><div class="overview-identity"><span class="overview-label">当前批次</span><strong id="overviewTitle">等待表型数据</strong></div><div id="summary" class="overview-values" role="status" aria-live="polite"></div></section>
    <main class="workbench-grid">
      <aside id="plantNavigator" class="plant-navigator" aria-labelledby="plantNavigatorTitle"><div class="navigator-heading"><div><p class="section-code">PLANT INDEX</p><h2 id="plantNavigatorTitle">24 株记录</h2></div><strong id="plantCount">0 株</strong></div><div id="plantFilters" class="plant-filters" role="group" aria-label="植株筛选"><button class="filter-button selected" type="button" data-filter="all" aria-pressed="true">全部</button><button class="filter-button" type="button" data-filter="complete" aria-pressed="false">完整</button><button class="filter-button" type="button" data-filter="review" aria-pressed="false">待复核</button></div><div id="plants" class="plant-records" aria-live="polite"><div class="navigator-empty">选择表型批次后查看植株</div></div></aside>
      <section id="inspectionWorkspace" class="inspection-workspace" aria-labelledby="inspectionTitle"><header class="inspection-header"><div class="inspection-title-block"><p class="section-code">PLANT REVIEW</p><div class="inspection-title-line"><h2 id="inspectionTitle">植株详情</h2><span id="inspectionStatus" class="status-tag status-neutral">等待选择</span></div><p id="inspectionLocation">选择一株水稻查看三视角证据</p></div><div class="plant-stepper" aria-label="连续浏览植株"><button id="previousPlant" class="step-button" type="button" disabled title="上一株">上一株</button><span id="plantPosition">0 / 0</span><button id="nextPlant" class="step-button" type="button" disabled title="下一株">下一株</button></div></header><div id="viewComparison" class="view-comparison" aria-label="左中右三视角 RGB-D 证据"></div><section class="evidence-section" aria-labelledby="evidenceTitle"><div class="evidence-heading"><div><p class="section-code">MEASUREMENT EVIDENCE</p><h3 id="evidenceTitle">测量与复核</h3></div></div><dl id="evidence" class="evidence-table"></dl></section></section>
    </main>
  </div>
  <dialog id="imageDialog" class="image-dialog" aria-labelledby="imageDialogTitle"><div class="image-dialog-header"><h2 id="imageDialogTitle">查看原图</h2><button id="closeImage" class="icon-button" type="button" aria-label="关闭原图">×</button></div><img id="imageDialogImage" alt="表型采集原图"></dialog>
  <dialog id="accessDialog" class="admin-dialog" aria-labelledby="accessDialogTitle"><form method="dialog"><p class="section-code">ACCESS CONTROL</p><h2 id="accessDialogTitle">访问验证</h2><label class="field-label" for="pin">管理员 PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><p id="accessStatus" class="form-status" role="status"></p><div class="dialog-actions"><button class="button button-quiet" value="cancel">取消</button><button id="login" class="button button-primary" value="default">验证</button></div></form></dialog>
  <script src="/app.js"></script>
</body>
</html>
